# --- Power / battery (wireless) ---
# Enable deep sleep to save battery when idle.
CONFIG_ZMK_SLEEP=y
# Go to deep sleep after 15 minutes (900000 ms) of inactivity.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- Pointing / mouse emulation ---
# Enables &mkp / &mmv / &msc, used by the mou and snipe layers.
# NOTE: this changes the HID report descriptor, and hosts cache it. After
# flashing, run &bt BT_CLR_ALL (fn + the ⌘⌃⇧3 row), remove the keyboard from
# macOS Bluetooth settings, and re-pair every profile — until then the mouse
# keys are silently dead over BLE.
CONFIG_ZMK_POINTING=y
# Smooth scrolling via HID resolution multipliers. Left off for now: it changes
# the scroll scale, so &msc would want retuning to MOVE_ values the same day.
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# --- Host compatibility ---
# USB boot protocol — required to type the FileVault password at pre-boot,
# where the full HID stack is not yet available. Wired only, so keep a cable.
CONFIG_ZMK_USB_BOOT=y

# --- Optional hardware (leave commented unless you have them) ---
# Rotary encoder:
#   NOTE: lily58.keymap already carries `sensor-bindings` on the default layer.
#   That binding is inert until this is uncommented AND the encoder is fitted.
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# OLED display:
# CONFIG_ZMK_DISPLAY=y
